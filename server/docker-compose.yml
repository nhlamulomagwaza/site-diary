services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/app/data/site-diary.db
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL=
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  sqlite-data:
